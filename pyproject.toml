[project]
name = "content2podcast"
version = "0.1.0"
description = "Turn blog and news articles into German podcast episodes."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "feedparser>=6.0.14",
    "filelock>=4.0.9",
    "httpx>=0.27",
    "lxml>=6.1.3",
    "openai>=3.24.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "trafilatura>=2.3.0",
    "typer>=0.12",
    "tzdata>=2026.4",
]

[project.scripts]
podcast = "content2podcast.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/content2podcast"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "ffmpeg: tests that need ffmpeg on PATH (skipped otherwise)",
]
