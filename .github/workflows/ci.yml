name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: uv run pytest
